
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile | Project Atlas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 380px;
            margin: 20px;
            box-shadow: 0 4px 15px #00000018;
        }

        h1 { color: #243b53; }
        .role { color: #2878d0; font-weight: bold; }

        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0;
            list-style: none;
        }

        .skills li {
            background: #e6f0ff;
            padding: 8px 12px;
            border-radius: 20px;
        }

        .profile-link {
            display: inline-block;
            margin-top: 15px;
            background: #243b53;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
        }

        .profile-link:hover { background: #2878d0; }
    </style>
</head>
<body>
    <main class="profile-card">
        <h1>Reka Shri</h1>
        <p class="role">Computer Science and AI/ML Student</p>

        <p>
            I am passionate about artificial intelligence,
            technology, and building useful digital solutions.
        </p>

        <h2>Skills</h2>
        <ul class="skills">
            <li>Python</li>
            <li>HTML & CSS</li>
            <li>Artificial Intelligence</li>
        </ul>

        <a
            class="profile-link"
            href="https://github.com/rekashri2008-oss"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Reka Shri's GitHub profile"
        >
            Visit My GitHub
        </a>
    </main>
    <!-- Project Atlas developer profile card -->
</body>
</html>
